<style>
    .subscribe-button{
        background-color:rgb(200, 0, 0);
        color:white;
        border:none;
        height:36px;
        width:105px;
        border-radius:2px;
        cursor:pointer;
        margin-right:8px;
        transition:opacity 0.15s;
    }
    .subscribe-button:hover{
        opacity:0.7;
    }
    .subscribe-button:active{
        opacity:0.4;
    }
    .join-button{
        background-color: white;
        color:rgb(53, 178, 228);
        border-color:skyblue;
        border-style:solid;
        /* border-width:1px; */
        height:36px;
        width:60px;
        border-radius: 2px;
        cursor:pointer;
        transition:background-color 1s,
        color 1s;
    }
    .join-button:hover{
        background-color:rgb(53, 178, 228);
        color:white;
    }
    .join-button:active{
        opacity:0.7;
    }
    .tweet-button{
        background-color:rgb(24, 151, 202);
        color:white;
        height:37px;
        width:80px;
        border-radius:18px;
        border:none;
        font-weight: bold;
        font-size:14px;
        margin-left:6px;
        cursor:pointer;
        transition: box-shadow 0.2s;
    }
    .tweet-button:hover{
        box-shadow:5px 5px 10px rgba(0,0,0,0.2);

    }
    .request-button{
        background-color: black;
        color:white;
        height:40px;
        width:115px;
        margin-top:6px;
        border:none;
        cursor:pointer;
    }
    .request-button:hover{
        opacity:0.8;
    }
    .cart-button{
        background-color: rgb(255, 216, 20);
        color:black;
        border-radius:15px;
        border:none;
        height: 36px;
        width:185px;
        margin-top:6px;
        margin-bottom:6px;
        cursor: pointer;
        transition:background-color 0.5s;
    }
    .cart-button:hover{
        background-color: rgb(248, 222, 90);
    }
    
    .signup-button{
        background-color: rgb(46,164,79);
        color:white;
        border:none;
        height:36px;
        width:80px;
        border-radius:6px;
        cursor:pointer;
        font-weight:bold;
        transition:  box-shadow 0.2s;
    }
    .signup-button:hover{
        box-shadow:5px 5px 10px rgba(0,0,0,0.2);
    }
    .start-button{
        background-color: rgb(121, 82, 179);
        color:white;
        height:36px;
        width:100px;
        border:none;
        font-weight: bold;
        transition: background-color 0.5s;
    }
    .start-button:hover{
        background-color:rgb(122, 24, 122);
    }
    .download-button{
        background-color: white;
        color:grey;
        border-color: grey;
        border-width:2px;
        height:36px;
        width:100px;
        border-radius:3px;
        border-style:solid;
        font-weight:bold;
        margin-top:6px;
        transition: background-color 0.8s,color 1s;
    }
    .download-button:hover{
        background-color:grey;
        color:white;
    }
    .apply-button{
        background-color: rgb(10,102,194);
        color:white;
        height:36px;
        width: 200px;
        border-radius:20px;
        border:none;
        font-weight:bold;
        margin-top:6px;
        transition:background-color 0.8s;
    }
    .apply-button:hover{
        background-color:blue;
    }
    .save{
        background-color: white;
        color:rgb(52, 102, 218);
        height:36px;
        width:70px;
        border-radius:20px;
        border-color:rgb(51, 114, 214);
        border-style:solid;
        font-weight:bold;
        border-width:2px;
        margin-top:6px;
        transition: background-color 0.6s;
    }
    .save:hover{
        background-color:rgb(96, 198, 238);
        border-width: 4px;;
    }
</style>

<button class="subscribe-button">
    SUBSCRIBE
</button>
<button class ="join-button">
    JOIN
</button>
<button class ="tweet-button">
    Tweet
</button>
<button class = "request-button">
    Request now
</button>
<button class = "cart-button">
    Add to Cart
</button>
<button class ="signup-button">
    Sign up
</button>

<button class = "start-button">
    Get started
</button>

<button class = "download-button">
    Download
</button>

<button class = "apply-button">
    Apply on company website
</button>

<button class = "save">
    Save
</button>
